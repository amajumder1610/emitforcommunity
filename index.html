<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://helpx.adobe.com; img-src 'self'; style-src 'self'; script-src 'self';">
<title>EMIT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <h1>EMIT</h1>
    <p class="tagline">Embed Media Ingest Tool for Gainsight</p>
  </div>

  <main class="page">
    <section id="section-token" class="card">
      <p class="prompt">Connect using passphrase</p>
      <div class="row">
        <input id="token-input" type="password" autocomplete="off" placeholder="Passphrase" />
        <button id="token-toggle" type="button" class="btn-secondary">Show</button>
      </div>
      <label class="checkbox-row">
        <input id="token-remember" type="checkbox" />
        <span>Remember me on this device</span>
      </label>
      <button id="token-connect" type="button" class="btn-primary">Connect</button>
      <p id="token-status" class="status" role="status"></p>
    </section>

    <section id="section-upload" class="card" hidden>
      <h2>Upload</h2>

      <div class="pathway-toggle">
        <button id="pathway-video-btn" type="button" class="pathway-btn active">Upload a video</button>
        <button id="pathway-url-btn" type="button" class="pathway-btn">From a page link</button>
      </div>

      <div id="pathway-video">
        <label for="video-file">Video file</label>
        <input id="video-file" type="file" accept="video/*" />
        <p id="video-file-info" class="status-muted"></p>
        <button id="video-upload" type="button" class="btn-primary">Upload</button>
      </div>

      <div id="pathway-url" hidden>
        <label for="helpx-url">Page link</label>
        <input id="helpx-url" type="text" placeholder="https://helpx.adobe.com/..." />
        <button id="helpx-submit" type="button" class="btn-primary">Get link</button>
      </div>

      <p id="upload-status" class="status" role="status"></p>
    </section>

    <section id="section-result" class="card" hidden>
      <h2>Done</h2>
      <a id="result-open" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary">Open link</a>
      <p id="result-note" class="status-muted"></p>
      <button id="embed-copy" type="button" class="btn-secondary">Copy embed code</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
